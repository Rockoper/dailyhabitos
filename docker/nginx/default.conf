# DailyHábitos — vhost de producción.
# Sirve exclusivamente desde /var/www/html/public y reenvía PHP a
# dailyhabitos-app:9000 (PHP-FPM). TLS lo termina Cloudflare (Tunnel); este
# servidor solo habla HTTP en la red interna del proyecto.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Cabeceras de seguridad razonables. HSTS se deja fuera a propósito:
    # lo debe emitir Cloudflare (el edge TLS), no un origen que también se
    # sirve por HTTP plano dentro de la red Docker.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Livewire 4 sirve su script (livewire.min.js) y sus endpoints de
    # actualización dinámicamente bajo /livewire-{hash}/ — no son archivos
    # físicos en /public. Debe ir antes del bloque de estáticos por
    # extensión de abajo: ese bloque hace `try_files $uri =404` y por eso
    # devolvía 404 para /livewire-*/livewire.min.js, impidiendo que
    # Livewire se inicializara en el navegador.
    location ^~ /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass dailyhabitos-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Cloudflare Tunnel entrega X-Forwarded-Proto: https aunque aquí
        # dentro todo viaje por HTTP plano; Laravel lo detecta vía
        # TrustProxies (bootstrap/app.php) para generar URLs y cookies
        # seguras correctamente.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquea cualquier archivo/directorio oculto, incluyendo .env, .git, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Cinturón y tirantes: nunca servir estas extensiones aunque terminen
    # dentro de /public por error.
    location ~* \.(?:env|log|sqlite|sql|yml|yaml|dist|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
