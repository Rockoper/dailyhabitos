; DailyHábitos — overrides de php.ini para producción.
; Se copia como /usr/local/etc/php/conf.d/99-dailyhabitos.ini, así que se
; aplica DESPUÉS de los defaults de la imagen oficial (php.ini-production
; no se usa directamente para no perder los defaults ya afinados de la imagen).

; La zona horaria de la app también se fija en config/app.php, pero dejarla
; aquí evita warnings de PHP en funciones nativas de fecha usadas fuera de
; Carbon/Laravel.
date.timezone = America/Bogota

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; Sesiones van por Redis (SESSION_DRIVER=redis), no por el manejador nativo
; de archivos de PHP; no hace falta tocar session.*.

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; En producción el código no cambia sin un rebuild/redeploy del contenedor,
; así que desactivar la verificación de timestamps evita overhead en cada
; request. Si se edita código dentro del contenedor sin rebuild, no se
; reflejará hasta reiniciar el servicio.
opcache.validate_timestamps = 0
opcache.save_comments = 1

[redis]
redis.session.locking_enabled = 1
